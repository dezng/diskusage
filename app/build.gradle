apply plugin: 'com.android.application'
android {
    compileSdkVersion 35
    ndkVersion '26.1.10909125'

    namespace 'com.google.android.diskusage'

    defaultConfig {
        applicationId "com.google.android.diskusage"
        targetSdkVersion 35
        minSdkVersion 14


        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix ".debug"
            // The development emulator is x86_64. Keep the shipped release
            // arm64-only; debug builds can also run on the emulator.
            ndk {
                abiFilters 'x86_64'
            }
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = []
            resources.srcDirs = []
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation files('src/main/extra/system.jar')

//    implementation 'androidx.core:core:1.0.0'
    implementation project(":libs")
}
